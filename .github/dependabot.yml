version: 2
updates:
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "weekly"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      # init/analyze/upload-sarif must always move together: CodeQL fails with a
      # configuration error if the steps run mismatched action versions.
      codeql-action:
        patterns:
          - "github/codeql-action*"
