name: Go

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:

  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go-version: ['1.25', 'stable']
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Set up Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version: ${{ matrix.go-version }}

    - name: Build
      run: go build -v ./...

    - name: Vet
      run: go vet ./...

    # golangci-lint v2 requires a Go toolchain newer than the oldest supported
    # Go version in the matrix, and setup-go pins GOTOOLCHAIN=local, so the lint
    # step can only build on the `stable` leg. Linting once is enough.
    - name: Lint
      if: matrix.go-version == 'stable'
      uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
      with:
        version: v2.13.2
        install-mode: goinstall

    - name: Build examples
      run: go build ./examples/...

    - name: Test
      run: go test -v -race -coverprofile=coverage.txt -covermode=atomic .
    - name: Vulnerability scan
      if: matrix.go-version == 'stable'
      run: |
        go install golang.org/x/vuln/cmd/govulncheck@v1.5.0
        govulncheck ./...

    - name: Upload coverage reports to Codecov
      if: matrix.go-version == 'stable'
      uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        slug: aafeher/go-sitemap-parser
