name: Go

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:

  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go-version: ['1.26', 'stable']
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Set up Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version: ${{ matrix.go-version }}

    - name: Build
      run: go build -v ./...

    - name: Vet
      run: go vet ./...

    # Nothing else looks at the formatting: golangci-lint runs no formatter and
    # leaves out the examples. The gofmt of one Go release may format a file
    # differently from that of another, so the check runs on one leg of the
    # matrix only: `stable`, the release a contributor formats with.
    - name: Format
      if: matrix.go-version == 'stable'
      run: |
        unformatted="$(gofmt -l .)"
        if [ -n "$unformatted" ]; then
          while IFS= read -r file; do
            echo "::error file=$file::$file is not formatted, run 'gofmt -w $file'"
          done <<< "$unformatted"
          gofmt -d . || true
          exit 1
        fi

    # golangci-lint's minimum Go version tracks the latest Go release, so the
    # oldest leg of the matrix periodically becomes too old to build it while
    # setup-go pins GOTOOLCHAIN=local. Gating the step to `stable` keeps that
    # from blocking CI; linting once per push is enough.
    - name: Lint
      if: matrix.go-version == 'stable'
      uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
      with:
        version: v2.14.0
        install-mode: goinstall

    - name: Build examples
      run: go build ./examples/...

    - name: Test
      run: go test -v -race -coverprofile=coverage.txt -covermode=atomic .

    # `go test` runs no benchmark unless it is asked to, so one that fails is
    # not noticed by the step above. Each benchmark is run once here: not to
    # measure anything, which a shared runner is no place for, but to see that
    # it still passes.
    - name: Benchmarks
      run: go test -run '^$' -bench . -benchtime 1x .

    - name: Vulnerability scan
      if: matrix.go-version == 'stable'
      run: |
        go install golang.org/x/vuln/cmd/govulncheck@v1.5.0
        govulncheck ./...

    - name: Upload coverage reports to Codecov
      if: matrix.go-version == 'stable'
      uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        slug: aafeher/go-sitemap-parser
